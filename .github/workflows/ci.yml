name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Python版のテスト
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --reinstall

      - name: Run tox
        run: uv run tox -e pytests,lint,typecheck,rust-fmt,rust-clippy

  # Rust単体テスト
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run Rust tests
        run: |
          cargo test face_mark_detection_matches_reference
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

  # TypeScript版のテスト（Linux）
  typescript-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: fast-bunkai-ts
        run: npm ci

      - name: Build native module
        working-directory: fast-bunkai-ts
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run build

      - name: Run tests
        working-directory: fast-bunkai-ts
        run: npm test

      - name: Type check
        working-directory: fast-bunkai-ts
        run: npm run typecheck

      - name: Lint
        working-directory: fast-bunkai-ts
        run: npm run lint

  # TypeScript版のテスト（macOS）
  typescript-tests-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: fast-bunkai-ts
        run: npm ci

      - name: Build native module
        working-directory: fast-bunkai-ts
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run build

      - name: Run tests
        working-directory: fast-bunkai-ts
        run: npm test

      - name: Type check
        working-directory: fast-bunkai-ts
        run: npm run typecheck

      - name: Lint
        working-directory: fast-bunkai-ts
        run: npm run lint

  # TypeScript版のテスト（Windows）
  typescript-tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: fast-bunkai-ts
        run: npm ci

      - name: Build native module
        working-directory: fast-bunkai-ts
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          npm run build

      - name: Run tests
        working-directory: fast-bunkai-ts
        run: npm test

      - name: Type check
        working-directory: fast-bunkai-ts
        run: npm run typecheck

      - name: Lint
        working-directory: fast-bunkai-ts
        run: npm run lint

